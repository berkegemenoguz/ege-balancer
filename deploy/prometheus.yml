# Prometheus scrapes the load balancer's metrics port. The balancer runs as a
# compose service alongside the mock backends it forwards to.
global:
  # Five seconds in this development stack, so the dashboard reacts while
  # someone is watching it. The production guidance is 15s; see section 7.6 of
  # the technical design document.
  scrape_interval: 5s

scrape_configs:
  - job_name: ege-balancer
    static_configs:
      - targets: ["loadbalancer:8081"]
    # To measure a balancer running on the host instead of in compose, stop the
    # loadbalancer service and point this at "host.docker.internal:8081".
    # Scraping both at once double counts: the compose service publishes 8081
    # on the host, so both addresses reach the same process.
