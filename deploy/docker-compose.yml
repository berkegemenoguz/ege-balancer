# Mock backend environment for development and testing.
# Each backend answers every request with its own identity, which makes the
# distribution behaviour of the load balancing algorithms observable.

services:
  backend-1:
    image: hashicorp/http-echo
    command: ["-text=backend-1", "-listen=:5678"]
    mem_limit: 32m
    ports: ["5681:5678"]

  backend-2:
    image: hashicorp/http-echo
    command: ["-text=backend-2", "-listen=:5678"]
    mem_limit: 32m
    ports: ["5682:5678"]

  backend-3:
    image: hashicorp/http-echo
    command: ["-text=backend-3", "-listen=:5678"]
    mem_limit: 32m
    ports: ["5683:5678"]

  backend-4:
    image: hashicorp/http-echo
    command: ["-text=backend-4", "-listen=:5678"]
    mem_limit: 32m
    ports: ["5684:5678"]

  backend-5:
    image: hashicorp/http-echo
    command: ["-text=backend-5", "-listen=:5678"]
    mem_limit: 32m
    ports: ["5685:5678"]

  backend-6:
    image: hashicorp/http-echo
    command: ["-text=backend-6", "-listen=:5678"]
    mem_limit: 32m
    ports: ["5686:5678"]

  backend-7:
    image: hashicorp/http-echo
    command: ["-text=backend-7", "-listen=:5678"]
    mem_limit: 32m
    ports: ["5687:5678"]

  backend-8:
    image: hashicorp/http-echo
    command: ["-text=backend-8", "-listen=:5678"]
    mem_limit: 32m
    ports: ["5688:5678"]

  backend-9:
    image: hashicorp/http-echo
    command: ["-text=backend-9", "-listen=:5678"]
    mem_limit: 32m
    ports: ["5689:5678"]

  backend-10:
    image: hashicorp/http-echo
    command: ["-text=backend-10", "-listen=:5678"]
    mem_limit: 32m
    ports: ["5690:5678"]

  loadbalancer:
    build:
      context: ..
      args:
        VERSION: dev
    ports: ["8080:8080", "8081:8081"]
    volumes: ["../configs/lb.example.yaml:/etc/lb/config.yaml:ro"]
    depends_on: [backend-1, backend-2]
    mem_limit: 128m
    # The image carries no shell, so there is nothing to run a container
    # healthcheck with; /status on port 8081 serves that purpose from outside.

  prometheus:
    image: prom/prometheus
    volumes: ["./prometheus.yml:/etc/prometheus/prometheus.yml"]
    ports: ["9090:9090"]
    mem_limit: 256m
    # Lets Prometheus reach the load balancer running on the host.
    extra_hosts: ["host.docker.internal:host-gateway"]

  grafana:
    image: grafana/grafana
    volumes: ["./grafana:/etc/grafana/provisioning"]
    ports: ["3000:3000"]
    depends_on: [prometheus]
    # Grafana 13 needs considerably more than the 256 MB the design document
    # suggests: it idles inside that but is killed while rendering a dashboard.
    mem_limit: 1g
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      # Grafana is a Go program, and without a budget the runtime lets the heap
      # grow until it hits the container limit and the process is killed. Told
      # its budget, it collects garbage before that point; the remaining 256 MB
      # of the limit covers what the runtime allocates outside the heap.
      GOMEMLIMIT: 768MiB
