# Mock backend environment for development and testing.
#
# The ten backends are one program, cmd/mockbackend, run with different
# profiles so that the pool behaves like a real one: most backends are fast,
# two are slower with less capacity, one is struggling, and one returns large
# answers. Every backend answers with its own name, in an X-Backend header and
# on the first line of the body, which keeps the distribution of the balancing
# algorithms observable.

x-mock: &mock
  build:
    context: ..
    dockerfile: deploy/mockbackend.Dockerfile
  image: ege-balancer-mock
  mem_limit: 32m

# Latency is the median and the 99th percentile of the time a request takes
# once a worker has picked it up; waiting in the queue comes on top of it.
# Beyond the queue a backend answers 503 at once, as an overloaded server would.
x-fast: &fast
  MOCK_LATENCY: 15ms
  MOCK_LATENCY_P99: 80ms
  MOCK_CAPACITY: "64"
  MOCK_QUEUE: "128"
  MOCK_BODY_SIZE: 4KiB

x-medium: &medium
  MOCK_LATENCY: 30ms
  MOCK_LATENCY_P99: 200ms
  MOCK_CAPACITY: "32"
  MOCK_QUEUE: "64"
  MOCK_BODY_SIZE: 4KiB

x-slow: &slow
  MOCK_LATENCY: 80ms
  MOCK_LATENCY_P99: 500ms
  MOCK_CAPACITY: "16"
  MOCK_QUEUE: "32"
  MOCK_BODY_SIZE: 4KiB

x-large: &large
  MOCK_LATENCY: 15ms
  MOCK_LATENCY_P99: 80ms
  MOCK_CAPACITY: "64"
  MOCK_QUEUE: "128"
  MOCK_BODY_SIZE: 256KiB

services:
  backend-1:
    <<: *mock
    environment: { <<: *fast, MOCK_NAME: backend-1 }
    ports: ["5681:5678"]

  backend-2:
    <<: *mock
    environment: { <<: *fast, MOCK_NAME: backend-2 }
    ports: ["5682:5678"]

  backend-3:
    <<: *mock
    environment: { <<: *fast, MOCK_NAME: backend-3 }
    ports: ["5683:5678"]

  backend-4:
    <<: *mock
    environment: { <<: *fast, MOCK_NAME: backend-4 }
    ports: ["5684:5678"]

  backend-5:
    <<: *mock
    environment: { <<: *fast, MOCK_NAME: backend-5 }
    ports: ["5685:5678"]

  backend-6:
    <<: *mock
    environment: { <<: *fast, MOCK_NAME: backend-6 }
    ports: ["5686:5678"]

  backend-7:
    <<: *mock
    environment: { <<: *medium, MOCK_NAME: backend-7 }
    ports: ["5687:5678"]

  backend-8:
    <<: *mock
    environment: { <<: *medium, MOCK_NAME: backend-8 }
    ports: ["5688:5678"]

  backend-9:
    <<: *mock
    environment: { <<: *slow, MOCK_NAME: backend-9 }
    ports: ["5689:5678"]

  backend-10:
    <<: *mock
    environment: { <<: *large, MOCK_NAME: backend-10 }
    ports: ["5690:5678"]

  loadbalancer:
    build:
      context: ..
      args:
        VERSION: dev
    ports: ["8080:8080", "8081:8081"]
    volumes: ["../configs/lb.example.yaml:/etc/lb/config.yaml:ro"]
    depends_on: [backend-1, backend-2]
    mem_limit: 128m
    # The image carries no shell, so there is nothing to run a container
    # healthcheck with; /status on port 8081 serves that purpose from outside.

  prometheus:
    image: prom/prometheus
    volumes: ["./prometheus.yml:/etc/prometheus/prometheus.yml"]
    ports: ["9090:9090"]
    mem_limit: 256m
    # Lets Prometheus reach the load balancer running on the host.
    extra_hosts: ["host.docker.internal:host-gateway"]

  grafana:
    image: grafana/grafana
    volumes: ["./grafana:/etc/grafana/provisioning"]
    ports: ["3000:3000"]
    depends_on: [prometheus]
    # Grafana 13 needs considerably more than the 256 MB the design document
    # suggests: it idles inside that but is killed while rendering a dashboard.
    mem_limit: 1g
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      # Grafana is a Go program, and without a budget the runtime lets the heap
      # grow until it hits the container limit and the process is killed. Told
      # its budget, it collects garbage before that point; the remaining 256 MB
      # of the limit covers what the runtime allocates outside the heap.
      GOMEMLIMIT: 768MiB
