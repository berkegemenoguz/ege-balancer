# Configuration for running the balancer on the host machine against the mock
# backends from deploy/docker-compose.yml, which publish themselves on the
# loopback ports 5681 to 5690. Everything else matches configs/lb.example.yaml.

listen_addr: ":8080"
metrics_addr: ":8081"       # /metrics and /status
enable_pprof: false         # adds /debug/pprof to the metrics port
algorithm: round_robin              # round_robin | least_connections | weighted_round_robin
failure_policy: retry_next_backend  # retry_next_backend | fail_fast | circuit_breaker
retry_on_5xx: false

retry:
  max_retries: 2

circuit_breaker:
  failure_threshold: 5
  open_duration: 30s

backends:
  - addr: "127.0.0.1:5681"
    weight: 1
  - addr: "127.0.0.1:5682"
    weight: 1
  - addr: "127.0.0.1:5683"
    weight: 1
  - addr: "127.0.0.1:5684"
    weight: 1
  - addr: "127.0.0.1:5685"
    weight: 1
  - addr: "127.0.0.1:5686"
    weight: 1
  - addr: "127.0.0.1:5687"
    weight: 1
  - addr: "127.0.0.1:5688"
    weight: 1
  - addr: "127.0.0.1:5689"
    weight: 1
  - addr: "127.0.0.1:5690"
    weight: 1

health_check:
  path: "/healthz"
  interval: 5s
  timeout: 2s
  healthy_threshold: 2
  unhealthy_threshold: 3

timeouts:
  connect_timeout: 2s
  read_timeout: 10s
  write_timeout: 10s
  idle_timeout: 60s

limits:
  max_connections: 10000
  max_request_body_bytes: 10485760  # 10 MB
  rate_limit_per_ip: 100            # requests per second

logging:
  level: info
  format: json
