# Example configuration for ege-balancer.
# Numeric values below are starting points; they are expected to be revised
# after the day 10 load test (see proposal section 3.3).

listen_addr: ":8080"
metrics_addr: ":8081"       # /metrics and /status
enable_pprof: false         # adds /debug/pprof to the metrics port
algorithm: round_robin              # round_robin | least_connections | weighted_round_robin
failure_policy: retry_next_backend  # retry_next_backend | fail_fast | circuit_breaker
retry_on_5xx: false

retry:
  max_retries: 2

circuit_breaker:
  failure_threshold: 5
  open_duration: 30s

backends:
  - addr: "backend-1:5678"
    weight: 1
  - addr: "backend-2:5678"
    weight: 1
  - addr: "backend-3:5678"
    weight: 1
  - addr: "backend-4:5678"
    weight: 1
  - addr: "backend-5:5678"
    weight: 1
  - addr: "backend-6:5678"
    weight: 1
  - addr: "backend-7:5678"
    weight: 1
  - addr: "backend-8:5678"
    weight: 1
  - addr: "backend-9:5678"
    weight: 1
  - addr: "backend-10:5678"
    weight: 1

health_check:
  path: "/healthz"
  interval: 5s
  timeout: 2s
  healthy_threshold: 2
  unhealthy_threshold: 3

timeouts:
  connect_timeout: 2s
  read_timeout: 10s
  write_timeout: 10s
  idle_timeout: 60s

limits:
  max_connections: 10000
  max_request_body_bytes: 10485760  # 10 MB
  rate_limit_per_ip: 100            # requests per second

logging:
  level: info
  format: json
